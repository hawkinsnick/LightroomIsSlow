name: Build portable AI skill
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate portable skill sources
        shell: bash
        run: |
          set -euo pipefail
          test -f skill/SKILL.md
          test -f skill/manifest.json
          test -f schema/session.schema.json
          test -f schema/telemetry-sample.schema.json
          test -f knowledge/lightroom/workloads.json
          python -m json.tool skill/manifest.json >/dev/null
          python -m json.tool schema/session.schema.json >/dev/null
          python -m json.tool schema/telemetry-sample.schema.json >/dev/null
          python -m json.tool knowledge/lightroom/workloads.json >/dev/null
      - name: Assemble skill package
        shell: bash
        run: |
          mkdir -p artifacts/lightroom-is-slow-skill/schema artifacts/lightroom-is-slow-skill/knowledge/lightroom
          cp skill/SKILL.md skill/manifest.json artifacts/lightroom-is-slow-skill/
          cp schema/*.json artifacts/lightroom-is-slow-skill/schema/
          cp knowledge/lightroom/*.json artifacts/lightroom-is-slow-skill/knowledge/lightroom/
          printf '%s\n' "$GITHUB_SHA" > artifacts/lightroom-is-slow-skill/SOURCE_COMMIT
          (cd artifacts && zip -r LightroomIsSlow-AI-Skill.zip lightroom-is-slow-skill)
      - uses: actions/upload-artifact@v4
        with:
          name: LightroomIsSlow-AI-Skill
          path: artifacts/LightroomIsSlow-AI-Skill.zip
